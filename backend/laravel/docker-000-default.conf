# Magician Clipper — Apache VirtualHost for the Render container.
#
# This file REPLACES the stock 000-default.conf (copied over it in the
# Dockerfile, to both sites-available and sites-enabled). It uses
# literal paths only — no ${VAR} expansion.
#
# WHY <VirtualHost *:*> and not *:80 (root cause, proven locally
# 2026-11-23): Render injects $PORT (10000) and the entrypoint
# rebinds `Listen 80` to `Listen 10000`, but a <VirtualHost *:80>
# only matches port 80. Requests on :10000 match NO vhost, so Apache
# serves them from the MAIN server (DocumentRoot /var/www/html) —
# /up 404s and / 403s, and no vhost edit of any kind can fix it.
# That is why deploys fdcc6c6, 721d87d and 6da589d all failed the
# health check identically. <VirtualHost *:*> matches every port,
# so the vhost (DocumentRoot /var/www/html/public) serves :10000.
# Verified on this VM with apache2 2.4.58: *:80 + Listen 10000
# reproduces GET /up -> 404; *:* + Listen 10000 gives
# GET /up -> 200 {"status":"ok"}, GET / -> 200.
<VirtualHost *:*>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
