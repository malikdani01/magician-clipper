# Magician Clipper — Apache VirtualHost for the Render container.
#
# This file REPLACES the stock 000-default.conf (copied over it in the
# Dockerfile). It uses literal paths only — no ${VAR} expansion.
#
# Why: the stock pattern (ENV APACHE_DOCUMENT_ROOT + sed rewriting the
# config to `DocumentRoot ${APACHE_DOCUMENT_ROOT}`) failed on Render:
# the 2026-11-22 deploy of fdcc6c6 built fine, but Apache served
# /var/www/html (not /var/www/html/public), so /up returned
# 403 AH01630 "client denied by server configuration" and the Render
# health check timed out after 15 minutes. Literal paths remove
# every expansion step that could silently fail.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
